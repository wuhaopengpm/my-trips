<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Trips">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
<title>My Trips · 离线旅行攻略助手</title>
</head>
<body>
<div class="app">
<header class="topbar"><div><div class="kicker">MY OFFLINE TRAVEL LIBRARY</div><div class="brand" id="brand">My Trips</div><div class="sub" id="brandSub">离线旅行攻略助手</div></div><div class="pill" id="statusPill">离线可用</div></header>
<nav class="daystrip" id="daystrip"></nav>
<main id="main"></main>
</div>
<nav class="bottomnav">
<button class="navbtn active" data-view="library">旅行库</button>
<button class="navbtn" data-view="today">当天</button>
<button class="navbtn" data-view="orders">订单</button>
<button class="navbtn" data-view="tools">资料</button>
</nav>
<div class="modal" id="orderModal"><div class="sheet"><div style="display:flex;justify-content:space-between;align-items:center"><h3 id="orderSheetTitle">添加凭证</h3><button class="btn" id="orderClose">关闭</button></div><div id="orderCurrent"></div><div class="field"><label for="orderFile">订单 / 二维码截图</label><input id="orderFile" type="file" accept="image/*"></div><div class="field"><label for="orderNote">备注</label><textarea id="orderNote" placeholder="集合点、票号、司机 WhatsApp 等"></textarea></div><div class="sheet-actions"><button class="btn primary wide" id="orderSave">保存到本机</button></div></div></div>
<script src="./app.js"></script>
</body>
</html>
